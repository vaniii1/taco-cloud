databaseChangeLog:
  - changeSet:
      id: init-02-roles
      author: vani
      changes:
        - insert:
            tableName: roles
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: role_name, value: "USER"}
              - column: {name: is_deleted, valueBoolean: false}

        - insert:
            tableName: roles
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: role_name, value: "MANAGER"}
              - column: {name: is_deleted, valueBoolean: false}

        - insert:
            tableName: roles
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: role_name, value: "DEVELOPER"}
              - column: {name: is_deleted, valueBoolean: false}